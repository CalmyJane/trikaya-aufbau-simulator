# Sends a short Telegram message. Not triggered by pushes: Claude starts it explicitly
# (workflow_dispatch) at the end of a job or when it needs an answer.
# Needs repository secrets TELEGRAM_BOT_TOKEN (from @BotFather) and TELEGRAM_CHAT_ID.
name: Notify

on:
  workflow_dispatch:
    inputs:
      message:
        description: Text for the Telegram message
        required: true

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: ${{ inputs.message }}
        run: |
          curl -sS --fail -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${TEXT}" > /dev/null
