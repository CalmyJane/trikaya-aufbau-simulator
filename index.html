<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Trikaya Aufbau Simulator</title>
  <link rel="icon" href="assets/ui/logo_notext.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poiret+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/ui/style.css" />
  <link rel="preload" as="image" href="assets/ui/logo_mandala.png" />
  <link rel="preload" as="image" href="assets/ui/logo_wordmark.png" />
  <style>
    /* Loading screen – inline so it animates from the very first frame. Only transform & opacity are
       animated (compositor), so it stays smooth while the game builds the world. */
    #loading { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #1e3322, #070a08 72%); transition: opacity 0.7s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    .ld-stage { display: flex; flex-direction: column; align-items: center; gap: 3vmin; animation: ld-fade 0.9s ease-out both; }
    .ld-mandala { position: relative; width: min(56vw, 40vh, 300px); aspect-ratio: 1; }
    .ld-mandala > * { position: absolute; inset: 0; will-change: transform, opacity; }
    .ld-mandala i { position: absolute; inset: 0; background: url('assets/ui/logo_mandala.png') center / 100% no-repeat; will-change: transform; }
    /* soft sun rays turning slowly behind the mandala */
    .ld-rays { inset: -38%; border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(255, 196, 96, 0.16) 0deg 5deg, transparent 5deg 15deg);
      -webkit-mask: radial-gradient(circle closest-side, #000 30%, transparent 100%); mask: radial-gradient(circle closest-side, #000 30%, transparent 100%);
      animation: ld-spin 60s linear infinite; }
    .ld-glow { inset: -12%; border-radius: 50%; background: radial-gradient(circle closest-side, rgba(232, 163, 58, 0.42), rgba(232, 163, 58, 0.1) 60%, transparent 75%);
      animation: ld-glow 3.2s ease-in-out infinite; }
    .ld-rings { animation: ld-pop 1.1s cubic-bezier(.2, .9, .25, 1) both; }
    .ld-rings i { -webkit-mask: radial-gradient(circle closest-side, transparent 36%, #000 37%); mask: radial-gradient(circle closest-side, transparent 36%, #000 37%);
      animation: ld-spin 36s linear infinite; }
    .ld-core { animation: ld-pop 1.1s cubic-bezier(.2, .9, .25, 1) 0.1s both; }
    .ld-core i { -webkit-mask: radial-gradient(circle closest-side, #000 37%, transparent 38%); mask: radial-gradient(circle closest-side, #000 37%, transparent 38%);
      animation: ld-breathe 3.2s ease-in-out infinite; }
    /* progress ring around the mandala */
    .ld-ring { inset: -6%; width: 112%; height: 112%; transform: rotate(-90deg); overflow: visible; }
    .ld-ring circle { fill: none; stroke-width: 1.6; }
    .ld-ring .bg { stroke: rgba(232, 163, 58, 0.16); }
    .ld-ring .fg { stroke: url(#ld-grad); stroke-linecap: round; stroke-dasharray: 301.6; stroke-dashoffset: 301.6; transition: stroke-dashoffset 0.6s cubic-bezier(.3, .8, .3, 1); }
    .ld-side { display: flex; flex-direction: column; align-items: center; gap: 1.4vmin; }
    /* the wordmark is there right away; a light sweeps over it */
    .ld-word { position: relative; width: min(74vw, 50vh, 360px); aspect-ratio: 473 / 189; overflow: hidden;
      background: url('assets/ui/logo_wordmark.png') center / 100% no-repeat;
      -webkit-mask: url('assets/ui/logo_wordmark.png') center / 100% no-repeat; mask: url('assets/ui/logo_wordmark.png') center / 100% no-repeat;
      animation: ld-rise 1s cubic-bezier(.2, .8, .2, 1) 0.15s both; }
    .ld-word::after { content: ''; position: absolute; inset: 0 -60%; will-change: transform;
      background: linear-gradient(105deg, transparent 40%, rgba(255, 246, 220, 0.85) 50%, transparent 60%);
      transform: translateX(-70%); animation: ld-shine 3.6s ease-in-out 1s infinite; }
    #loading-text { color: #dfe6d6; font: 16px 'Baloo 2', system-ui, sans-serif; letter-spacing: 0.3px; min-height: 1.5em; text-align: center; }
    #loading-text.in { animation: ld-rise 0.5s ease both; }
    .ld-rotate { display: none; color: #e8a33a; font: 14px 'Baloo 2', system-ui, sans-serif; opacity: 0.85; }
    #loading.ld-port.ld-touch .ld-rotate { display: block; }
    /* phones sideways: logo left, text right (class set by the script below, so turning the phone animates) */
    #loading.ld-land .ld-stage { flex-direction: row; gap: 7vw; }
    #loading.ld-land .ld-mandala { width: min(60vh, 38vw); }
    #loading.ld-land .ld-word { width: min(42vw, 58vh); }
    /* turning the phone: the parts glide to their new place */
    .ld-mandala { view-transition-name: ld-mandala; }
    .ld-word { view-transition-name: ld-word; }
    #loading-text { view-transition-name: ld-text; }
    ::view-transition-group(*) { animation-duration: 0.55s; animation-timing-function: cubic-bezier(.3, .8, .25, 1); }
    #loading.ld-fade .ld-stage { opacity: 0; transform: scale(0.96); }
    .ld-stage { transition: opacity 0.25s ease, transform 0.25s ease; }
    @keyframes ld-spin { to { transform: rotate(360deg); } }
    @keyframes ld-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ld-pop { from { transform: scale(0.82) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes ld-glow { 0%, 100% { opacity: 0.6; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes ld-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes ld-rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes ld-shine { 0% { transform: translateX(-70%); } 55%, 100% { transform: translateX(70%); } }
    @media (prefers-reduced-motion: reduce) { #loading * { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Loading -->
  <div id="loading" aria-label="Trikaya Festival – lädt">
    <div class="ld-stage">
      <div class="ld-mandala">
        <div class="ld-rays"></div>
        <div class="ld-glow"></div>
        <div class="ld-rings"><i></i></div>
        <div class="ld-core"><i></i></div>
        <svg class="ld-ring" viewBox="0 0 100 100" aria-hidden="true">
          <defs><linearGradient id="ld-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a" /><stop offset="1" stop-color="#e8a33a" /></linearGradient></defs>
          <circle class="bg" cx="50" cy="50" r="48" /><circle class="fg" id="loading-ring" cx="50" cy="50" r="48" />
        </svg>
      </div>
      <div class="ld-side">
        <div class="ld-word" role="img" aria-label="Trikaya Festival"></div>
        <div id="loading-text">Wird geladen…</div>
        <div class="ld-rotate" data-i18n="load.rotate">📱↻ Tipp: im Querformat spielt es sich besser</div>
      </div>
    </div>
    <div class="sys-icons">
      <button id="btn-fullscreen" class="icon-btn" title="Fullscreen">⛶</button>
    </div>
    <div class="cj-badge"><img src="assets/ui/calmyjane_text.svg" alt="Calmy Jane" class="cj-text" /></div>
  </div>
  <script>
    // the TRIKAYA FESTIVAL wordmark, cut into letters (used by the loading screen and the menu)
    window.trikayaWord = function (word) {
      if (!word || word.children.length) return;
      var W = 473, H = 189;
      var top = [[4, 70], [79, 163], [176, 187], [208, 274], [277, 343], [343, 405], [405, 470]];
      var bot = [[103, 130], [139, 170], [176, 212], [213, 247], [255, 261], [269, 305], [306, 341], [350, 379]];
      var cuts = top.map(function (c) { return [c[0], c[1], 0, 120]; }).concat(bot.map(function (c) { return [c[0], c[1], 120, H]; }));
      cuts.forEach(function (c, i) {
        var s = document.createElement('span'), w = c[1] - c[0], h = c[3] - c[2];
        s.style.left = (c[0] / W) * 100 + '%'; s.style.top = (c[2] / H) * 100 + '%';
        s.style.width = (w / W) * 100 + '%'; s.style.height = (h / H) * 100 + '%';
        s.style.backgroundSize = (W / w) * 100 + '% ' + (H / h) * 100 + '%';
        s.style.backgroundPosition = (c[0] / (W - w)) * 100 + '% ' + (c[2] / (H - h)) * 100 + '%';
        s.style.setProperty('--i', i);
        s.style.setProperty('--r', (i % 2 ? 1 : -1) * (6 + (i * 7) % 9) + 'deg');
        word.appendChild(s);
      });
    };
    // loading screen follows the phone's orientation – smoothly (also while the world is being built)
    (function () {
      var ld = document.getElementById('loading');
      if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) ld.classList.add('ld-touch');
      var mode = null;
      function apply(m) { ld.classList.toggle('ld-land', m === 'land'); ld.classList.toggle('ld-port', innerHeight > innerWidth); }
      function update() {
        if (ld.classList.contains('hidden')) return;
        var m = innerWidth > innerHeight && innerHeight < 540 ? 'land' : 'col';
        if (m === mode) { apply(m); return; }
        var first = mode === null;
        mode = m;
        if (first) { apply(m); return; }
        if (document.startViewTransition) { document.startViewTransition(function () { apply(m); }); setTimeout(function () { if (mode === m) apply(m); }, 600); } // safety net: no painted frames → apply anyway
        else { ld.classList.add('ld-fade'); setTimeout(function () { apply(m); ld.classList.remove('ld-fade'); }, 250); }
      }
      update();
      addEventListener('resize', update);
      addEventListener('orientationchange', function () { setTimeout(update, 50); });
    })();
    // ?probe: record the longest gap between two frames while loading (to spot freezes)
    if (/[?&]probe/.test(location.search)) (function () {
      var last = performance.now(), gaps = (window.__frameGaps = []);
      var iv = setInterval(function () { var t = performance.now(); if (t - last > 100) (window.__bigGaps = window.__bigGaps || []).push([Math.round(last), Math.round(t - last)]); gaps.push(Math.round(t - last)); last = t; if (document.getElementById('loading').classList.contains('hidden')) clearInterval(iv); }, 16);
    })();
    // fullscreen works already while loading
    document.getElementById('btn-fullscreen').onclick = function () {
      if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
    };
  </script>

  <!-- Main menu -->
  <div id="menu" class="screen hidden">
    <div class="menu-panel">
      <div class="menu-brand" aria-label="Trikaya Festival – Aufbau Simulator">
        <div class="brand-mandala">
          <div class="ring r-outer"><i></i></div>
          <div class="ring r-mid"><i></i></div>
          <div class="ring r-core"><i></i></div>
        </div>
        <div class="brand-word"></div>
        <h1 class="menu-title">AUFBAU<span>SIMULATOR</span></h1>
      </div>
      <div class="menu-buttons">
        <button id="btn-continue" class="btn hidden" data-i18n="menu.continue"></button>
        <button id="btn-new" class="btn primary" data-i18n="menu.start"></button>
        <button id="btn-load" class="btn hidden" data-i18n="menu.load"></button>
        <button id="btn-controls" class="btn" data-i18n="menu.controls"></button>
        <button id="btn-settings" class="btn" data-i18n="menu.settings"></button>
        <button id="btn-credits" class="btn" data-i18n="menu.credits"></button>
      </div>
    </div>
    <div class="sys-icons">
      <button id="btn-preview" class="icon-btn" title="Fertiges Festival ansehen">🎪</button>
      <button id="btn-mute" class="icon-btn btn-mute" title="Sound"></button>
      <button id="btn-mfullscreen" class="icon-btn" title="Fullscreen">⛶</button>
    </div>
    <div class="cj-badge"><img src="assets/ui/calmyjane_text.svg" alt="Calmy Jane" class="cj-text" /></div>
    <div class="fly-hint"></div>
  </div>

  <!-- Info modal (controls / credits / quest log) -->
  <div id="modal" class="screen hidden">
    <div class="modal-panel">
      <div id="modal-body"></div>
      <button id="modal-close" class="btn" data-i18n="close"></button>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="screen hidden">
    <div class="modal-panel small">
      <h2 data-i18n="pause.title"></h2>
      <div class="menu-buttons">
        <button id="btn-resume" class="btn primary" data-i18n="pause.resume"></button>
        <button id="btn-log" class="btn" data-i18n="pause.log"></button>
        <button id="btn-map" class="btn" data-i18n="pause.map"></button>
        <button id="btn-psettings" class="btn" data-i18n="menu.settings"></button>
        <button id="btn-pcontrols" class="btn" data-i18n="menu.controls"></button>
        <button id="btn-quit" class="btn" data-i18n="pause.quit"></button>
      </div>
    </div>
    <div class="sys-icons">
      <button id="btn-pmute" class="icon-btn btn-mute" title="Sound"></button>
      <button id="btn-pfullscreen" class="icon-btn" title="Fullscreen">⛶</button>
    </div>
    <div class="fly-hint"></div>
    <button id="pmap-btn" class="pmap" title="Karte"><canvas id="pmap" width="220" height="220"></canvas></button>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <button id="hud-vol" class="hud-btn" title="Volunteers (V)">👥 <span data-i18n="vol.title"></span> <span class="kbd">V</span></button>
    <div id="stats">
      <div class="stat-row"><span class="karma-icon">✺</span> <b id="karma">0</b> <span data-i18n="hud.karma"></span></div>
      <div class="stat-row money-row">💶 <b id="money">0 €</b> · 🎟 <b id="tickets">0</b></div>

      <div class="stat-row small"><span data-i18n="hud.ready"></span> <b id="ready-pct">0%</b></div>
      <div class="ready-bar"><div id="ready-fill"></div></div>
      <div class="stat-row tiny" id="day-text"></div>
      <div id="effects"></div>
    </div>
    <div id="tracker"></div>
    <div id="toasts"></div>
    <div id="money-floats"></div>
    <div id="prompt" class="hidden"></div>
    <div id="progress" class="hidden"><div class="progress-label" id="progress-label">Building…</div><div class="progress-bar"><div id="progress-fill"></div></div></div>
    <div id="inventory"></div>
    <div id="stamina"><div id="stamina-fill"></div></div>
    <canvas id="minimap" width="220" height="220"></canvas>
    <div id="hint" data-i18n="hud.hint"></div>
    <div id="vehicle-hud" class="hidden"></div>
    <div id="bubbles"></div>
    <div id="dialog" class="hidden">
      <div class="dialog-portrait" id="dialog-portrait">☕</div>
      <div class="dialog-main">
        <div class="dialog-name"><span id="dialog-name">Bernd</span> <span id="dialog-role" class="dialog-role"></span></div>
        <div class="dialog-text" id="dialog-text"></div>
        <div class="dialog-choices" id="dialog-choices"></div>
        <div class="dialog-hint" id="dialog-hint"></div>
      </div>
    </div>
    <div id="banner" class="hidden"><div class="banner-top" id="banner-top">Quest complete</div><div class="banner-title" id="banner-title"></div><div class="banner-sub" id="banner-sub"></div></div>
  </div>

  <!-- Big map -->
  <div id="bigmap" class="screen hidden">
    <div class="bigmap-panel">
      <canvas id="bigmap-canvas" width="900" height="900"></canvas>
      <div class="bigmap-legend" data-i18n="map.legend"></div>
    </div>
  </div>

  <div id="fade"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
