# Builds the game and uploads it to the webspace (SFTP) on every push to main.
# Needs these repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_DIR, FTP_SECURE
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to webspace
        run: node scripts/deploy-ftp.mjs
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
